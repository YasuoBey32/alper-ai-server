name: keep-alive
# Render free web services sleep after 15 min idle; a ping every 10 min keeps Alper AI answering in seconds.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -m 120 https://alper-ai-server.onrender.com/health || true
